<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Books - Flibusta Downloader</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #13131a;
      --bg-card: #1a1a24;
      --text-primary: #e8e8f0;
      --text-secondary: #9494a8;
      --accent: #8b5cf6;
      --accent-hover: #a78bfa;
      --accent-dark: #6d28d9;
      --border: #2a2a38;
      --shadow: rgba(139, 92, 246, 0.15);
      --success: #10b981;
      --error: #ef4444;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, var(--bg-primary) 0%, #0f0a1a 100%);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 2.5rem;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 1rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      animation: slideUp 0.6s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Search Bar */
    .search-bar {
      margin-bottom: 1.5rem;
      position: relative;
    }

    .search-input {
      width: 100%;
      background: var(--bg-secondary);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 0.875rem 1rem 0.875rem 3rem;
      color: var(--text-primary);
      font-size: 0.9375rem;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
    }

    .search-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      pointer-events: none;
    }

    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .controls-left {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .format-selector {
      position: relative;
    }

    .format-btn {
      background: var(--accent);
      color: white;
      padding: 0.75rem 1.5rem;
      font-size: 0.9375rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
    }

    .format-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(139, 92, 246, 0.4);
    }

    .format-btn::after {
      content: '▼';
      font-size: 0.75rem;
      transition: transform 0.3s ease;
    }

    .format-selector.active .format-btn::after {
      transform: rotate(180deg);
    }

    .format-dropdown {
      position: absolute;
      top: calc(100% + 0.5rem);
      left: 0;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      min-width: 140px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 100;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }

    .format-selector.active .format-dropdown {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .format-option {
      padding: 0.875rem 1.25rem;
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
      display: block;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
    }

    .format-option:hover {
      background: var(--accent);
      color: white;
    }

    .bulk-actions {
      display: flex;
      gap: 0.5rem;
    }

    .btn-small {
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 1px solid var(--border);
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-small:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-1px);
    }

    .selection-counter {
      background: var(--bg-secondary);
      padding: 0.75rem 1.5rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .counter-number {
      background: var(--accent);
      color: white;
      padding: 0.25rem 0.625rem;
      border-radius: 6px;
      font-size: 0.875rem;
      min-width: 2rem;
      text-align: center;
    }

    .book-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
      max-height: 60vh;
      overflow-y: auto;
      padding: 0.5rem;
      margin: 0 -0.5rem 1.5rem;
      scrollbar-width: thin;
      scrollbar-color: var(--accent) var(--bg-secondary);
    }

    .book-grid::-webkit-scrollbar {
      width: 8px;
    }

    .book-grid::-webkit-scrollbar-track {
      background: var(--bg-secondary);
      border-radius: 4px;
    }

    .book-grid::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 4px;
    }

    .book-grid::-webkit-scrollbar-thumb:hover {
      background: var(--accent-hover);
    }

    .book-card {
      background: var(--bg-secondary);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      position: relative;
      overflow: hidden;
    }

    .book-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      width: 4px;
      height: 100%;
      background: var(--accent);
      transform: scaleY(0);
      transition: transform 0.3s ease;
    }

    .book-card:hover {
      border-color: var(--accent);
      background: var(--bg-card);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px var(--shadow);
    }

    .book-card:hover::before {
      transform: scaleY(1);
    }

    .book-card.selected {
      background: rgba(139, 92, 246, 0.15);
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2);
    }

    .book-card.selected::before {
      transform: scaleY(1);
    }

    .book-card.hidden {
      display: none;
    }

    .book-checkbox {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-radius: 6px;
      background: var(--bg-primary);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      position: relative;
    }

    .book-card.selected .book-checkbox {
      background: var(--accent);
      border-color: var(--accent);
    }

    .book-checkbox::after {
      content: '✓';
      color: white;
      font-size: 14px;
      font-weight: bold;
      opacity: 0;
      transform: scale(0);
      transition: all 0.2s ease;
    }

    .book-card.selected .book-checkbox::after {
      opacity: 1;
      transform: scale(1);
    }

    .book-title {
      color: var(--text-primary);
      font-size: 0.9375rem;
      line-height: 1.4;
      flex: 1;
    }

    .loading-spinner {
      display: none;
      text-align: center;
      padding: 3rem 0;
    }

    .loading-spinner.active {
      display: block;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      color: var(--text-secondary);
      font-size: 0.9375rem;
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-secondary);
    }

    .empty-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }

    /* Progress Bar */
    .progress-container {
      display: none;
      margin-bottom: 1.5rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
    }

    .progress-container.active {
      display: block;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: var(--bg-primary);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-hover));
      width: 0%;
      transition: width 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .progress-bar-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      animation: shimmer 2s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .action-buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      border: none;
      padding: 1rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(139, 92, 246, 0.4);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-primary);
      border: 2px solid var(--border);
      padding: 1rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
    }

    /* Toast Notifications */
    .toast-container {
      position: fixed;
      top: 2rem;
      right: 2rem;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .toast {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      min-width: 300px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      animation: slideInRight 0.3s ease;
    }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(100%);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .toast.success {
      border-left: 4px solid var(--success);
    }

    .toast.error {
      border-left: 4px solid var(--error);
    }

    .toast-icon {
      font-size: 1.5rem;
    }

    .toast-content {
      flex: 1;
    }

    .toast-title {
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .toast-message {
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    @media (max-width: 768px) {
      .card {
        padding: 1.5rem;
      }

      .controls-bar {
        flex-direction: column;
        align-items: stretch;
      }

      .controls-left {
        flex-direction: column;
      }

      .selection-counter {
        justify-content: center;
      }

      .book-grid {
        grid-template-columns: 1fr;
        max-height: 50vh;
      }

      .action-buttons {
        flex-direction: column;
      }

      .btn-primary,
      .btn-secondary {
        width: 100%;
        justify-content: center;
      }

      .toast-container {
        right: 1rem;
        left: 1rem;
      }

      .toast {
        min-width: auto;
      }
    }
  </style>
</head>
<body>
  <div class="toast-container" id="toastContainer"></div>

  <div class="container">
    <div class="header">
      <h2>📚 Books by Author</h2>
      <p class="subtitle">Select books to download</p>
    </div>

    <div class="card">
      <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input
          type="text"
          class="search-input"
          id="searchInput"
          placeholder="Search books by title..."
          autocomplete="off"
        >
      </div>

      <div class="controls-bar">
        <div class="controls-left">
          <div class="format-selector" id="formatSelector">
            <button type="button" class="format-btn" id="formatBtn">
              <span id="currentFormat">{{ file_format.upper() }}</span>
            </button>
            <div class="format-dropdown" id="formatDropdown">
              <button class="format-option" data-format="epub">EPUB</button>
              <button class="format-option" data-format="fb2">FB2</button>
              <button class="format-option" data-format="mobi">MOBI</button>
            </div>
          </div>
          <div class="bulk-actions">
            <button type="button" class="btn-small" id="selectAllBtn">Select All</button>
            <button type="button" class="btn-small" id="deselectAllBtn">Deselect All</button>
          </div>
        </div>
        <div class="selection-counter">
          <span>Selected:</span>
          <span class="counter-number" id="selectedCount">0</span>
        </div>
      </div>

      <form method="POST" action="/download" id="downloadForm">
        <input type="hidden" name="format" id="selectedFormat" value="{{ file_format }}">
        <input type="hidden" name="author_name" value="{{ author_name if author_name else '' }}">

        <div class="progress-container" id="progressContainer">
          <div class="progress-info">
            <span id="progressText">Preparing download...</span>
            <span id="progressPercent">0%</span>
          </div>
          <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progressBar"></div>
          </div>
        </div>

        <div id="bookList" class="book-grid">
          {% for title, link in books %}
          <div class="book-card" data-link="{{ link }}" data-title="{{ title }}">
            <div class="book-checkbox"></div>
            <span class="book-title">{{ title }}</span>
          </div>
          {% endfor %}
        </div>

        <div class="loading-spinner" id="loadingSpinner">
          <div class="spinner"></div>
          <div class="loading-text">Loading books...</div>
        </div>

        <div class="action-buttons">
          <button type="submit" class="btn-primary" id="downloadBtn">
            <span>⬇</span>
            Download Selected
          </button>
        </div>
      </form>
    </div>

    <div class="action-buttons" style="margin-top: 1.5rem;">
      <a href="{{ url_for('index') }}" class="btn-secondary">
        <span>←</span>
        Back to Search
      </a>
    </div>
  </div>

  <script>
    // Toast notification system
    function showToast(title, message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `
        <div class="toast-icon">${type === 'success' ? '✓' : '⚠️'}</div>
        <div class="toast-content">
          <div class="toast-title">${title}</div>
          <div class="toast-message">${message}</div>
        </div>
      `;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.animation = 'slideInRight 0.3s ease reverse';
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    // Save selections to localStorage
    function saveSelections() {
      const selected = Array.from(document.querySelectorAll('.book-card.selected'))
        .map(card => card.dataset.link);
      localStorage.setItem('selectedBooks_{{ author_id }}', JSON.stringify(selected));
    }

    function loadSelections() {
      const saved = localStorage.getItem('selectedBooks_{{ author_id }}');
      if (saved) {
        const selected = JSON.parse(saved);
        selected.forEach(link => {
          const card = document.querySelector(`.book-card[data-link="${link}"]`);
          if (card) {
            card.classList.add('selected');
          }
        });
        updateCount();
      }
    }

    const formatSelector = document.getElementById('formatSelector');
    const formatBtn = document.getElementById('formatBtn');
    const formatDropdown = document.getElementById('formatDropdown');
    const currentFormat = document.getElementById('currentFormat');
    const selectedFormat = document.getElementById('selectedFormat');
    const bookList = document.getElementById('bookList');
    const loadingSpinner = document.getElementById('loadingSpinner');
    const selectedCount = document.getElementById('selectedCount');
    const searchInput = document.getElementById('searchInput');
    const selectAllBtn = document.getElementById('selectAllBtn');
    const deselectAllBtn = document.getElementById('deselectAllBtn');
    const downloadForm = document.getElementById('downloadForm');
    const downloadBtn = document.getElementById('downloadBtn');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const progressPercent = document.getElementById('progressPercent');

    // Load saved selections on page load
    loadSelections();

    // Format dropdown toggle
    formatBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      formatSelector.classList.toggle('active');
    });

    document.addEventListener('click', (e) => {
      if (!formatSelector.contains(e.target)) {
        formatSelector.classList.remove('active');
      }
    });

    // Format change handler
    formatDropdown.addEventListener('click', async (e) => {
      const option = e.target.closest('.format-option');
      if (!option) return;

      const format = option.dataset.format;
      currentFormat.textContent = format.toUpperCase();
      selectedFormat.value = format;
      formatSelector.classList.remove('active');

      // Clear saved selections for new format
      localStorage.removeItem('selectedBooks_{{ author_id }}');

      loadingSpinner.classList.add('active');
      bookList.style.opacity = '0.3';
      bookList.innerHTML = '';
      selectedCount.textContent = '0';
      searchInput.value = '';

      try {
        const res = await fetch(`/api/books/{{ author_id }}?format=${format}`);
        const data = await res.json();

        loadingSpinner.classList.remove('active');
        bookList.style.opacity = '1';

        if (data.books.length === 0) {
          bookList.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">📚</div>
              <p>No books found for this format</p>
            </div>
          `;
          showToast('No Results', `No books found in ${format.toUpperCase()} format`, 'error');
          return;
        }

        data.books.forEach(([title, link]) => {
          const div = document.createElement('div');
          div.className = 'book-card';
          div.dataset.link = link;
          div.dataset.title = title;
          div.innerHTML = `
            <div class="book-checkbox"></div>
            <span class="book-title">${title}</span>
          `;
          bookList.appendChild(div);
        });

        showToast('Success', `Loaded ${data.books.length} books`, 'success');
      } catch (error) {
        loadingSpinner.classList.remove('active');
        bookList.style.opacity = '1';
        bookList.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">⚠️</div>
            <p>Error loading books. Please try again.</p>
          </div>
        `;
        showToast('Error', 'Failed to load books', 'error');
      }
    });

    // Search functionality
    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      const cards = bookList.querySelectorAll('.book-card');
      let visibleCount = 0;

      cards.forEach(card => {
        const title = card.dataset.title.toLowerCase();
        if (title.includes(query)) {
          card.classList.remove('hidden');
          visibleCount++;
        } else {
          card.classList.add('hidden');
        }
      });

      if (visibleCount === 0 && query) {
        if (!document.querySelector('.empty-state')) {
          bookList.insertAdjacentHTML('beforeend', `
            <div class="empty-state">
              <div class="empty-icon">🔍</div>
              <p>No books match your search</p>
            </div>
          `);
        }
      } else {
        const emptyState = bookList.querySelector('.empty-state');
        if (emptyState) emptyState.remove();
      }
    });

    // Bulk selection
    selectAllBtn.addEventListener('click', () => {
      const visibleCards = bookList.querySelectorAll('.book-card:not(.hidden)');
      visibleCards.forEach(card => {
        card.classList.add('selected');
      });
      updateCount();
      saveSelections();
      showToast('Selected', `${visibleCards.length} books selected`, 'success');
    });

    deselectAllBtn.addEventListener('click', () => {
      const selectedCards = bookList.querySelectorAll('.book-card.selected');
      const count = selectedCards.length;
      selectedCards.forEach(card => {
        card.classList.remove('selected');
      });
      updateCount();
      saveSelections();
      if (count > 0) {
        showToast('Deselected', 'All selections cleared', 'success');
      }
    });

    // Update selection counter
    function updateCount() {
      const count = document.querySelectorAll('.book-card.selected').length;
      selectedCount.textContent = count;
      downloadBtn.disabled = count === 0;
    }

    // Book selection handler
    bookList.addEventListener('click', (e) => {
      const card = e.target.closest('.book-card');
      if (!card || card.classList.contains('empty-state')) return;

      card.classList.toggle('selected');
      updateCount();
      saveSelections();
    });

    // Form submission with progress
    downloadForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const selectedCards = document.querySelectorAll('.book-card.selected');
      const selectedBooks = selectedCards.length;

      if (selectedBooks === 0) {
        showToast('No Selection', 'Please select at least one book', 'error');
        return;
      }

      // Build FormData manually from selected books
      const formData = new FormData();
      formData.append('format', selectedFormat.value);
      formData.append('author_name', downloadForm.querySelector('input[name="author_name"]').value);

      selectedCards.forEach(card => {
        formData.append('book_links', card.dataset.link);
        formData.append('book_titles', card.dataset.title);
      });

      progressContainer.classList.add('active');
      downloadBtn.disabled = true;

      let progress = 0;
      const interval = setInterval(() => {
        progress += Math.random() * 20;  // Increased from 15 for faster progress
        if (progress > 90) progress = 90;
        progressBar.style.width = progress + '%';
        progressPercent.textContent = Math.round(progress) + '%';
        progressText.textContent = progress < 30 ? 'Preparing download...' :
                                   progress < 60 ? 'Fetching books...' :
                                   'Creating archive...';
      }, 150);  // Reduced from 200ms to 150ms for smoother animation

      // Submit form
      fetch('/download', {
        method: 'POST',
        body: formData
      })
      .then(response => {
        if (!response.ok) throw new Error('Download failed');

        // Get filename from response header or construct it
        const disposition = response.headers.get('content-disposition');
        let filename = 'books.7z';

        if (disposition && disposition.includes('filename=')) {
          // Extract filename from Content-Disposition header
          const matches = disposition.match(/filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/);
          if (matches && matches[1]) {
            filename = matches[1].replace(/['"]/g, '');
          }
        } else if (selectedBooks === 1) {
          // For single book, use the book title
          const firstSelected = document.querySelector('.book-card.selected');
          if (firstSelected) {
            const title = firstSelected.dataset.title;
            // Sanitize filename - remove invalid characters
            const sanitized = title.replace(/[<>:"/\\|?*]/g, '_').trim();
            filename = `${sanitized}.${selectedFormat.value}`;
          }
        }

        return response.blob().then(blob => ({ blob, filename }));
      })
      .then(({ blob, filename }) => {
        clearInterval(interval);
        progressBar.style.width = '100%';
        progressPercent.textContent = '100%';
        progressText.textContent = 'Download complete!';

        // Trigger download
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        a.remove();

        showToast('Success', `Downloaded ${selectedBooks} book(s)`, 'success');

        setTimeout(() => {
          progressContainer.classList.remove('active');
          downloadBtn.disabled = false;
          progressBar.style.width = '0%';
        }, 2000);
      })
      .catch(error => {
        clearInterval(interval);
        progressContainer.classList.remove('active');
        downloadBtn.disabled = false;
        showToast('Error', 'Download failed. Please try again.', 'error');
        console.error('Download error:', error);
      });
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      // Ctrl+A or Cmd+A - Select all visible books
      if ((e.ctrlKey || e.metaKey) && e.key === 'a') {
        e.preventDefault();
        selectAllBtn.click();
      }

      // Escape - Clear search
      if (e.key === 'Escape') {
        searchInput.value = '';
        searchInput.dispatchEvent(new Event('input'));
      }

      // Ctrl+Enter or Cmd+Enter - Download
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        if (!downloadBtn.disabled) {
          downloadForm.dispatchEvent(new Event('submit'));
        }
      }
    });

    // Initialize download button state
    updateCount();
  </script>
</body>
</html>
