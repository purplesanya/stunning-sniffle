<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flibusta Downloader</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #13131a;
      --bg-card: #1a1a24;
      --text-primary: #e8e8f0;
      --text-secondary: #9494a8;
      --accent: #8b5cf6;
      --accent-hover: #a78bfa;
      --accent-dark: #6d28d9;
      --border: #2a2a38;
      --shadow: rgba(139, 92, 246, 0.15);
    }
    /* ... (all CSS remains the same as before) ... */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: linear-gradient(135deg, var(--bg-primary) 0%, #0f0a1a 100%); color: var(--text-primary); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; padding: 2rem; position: relative; overflow-x: hidden; overflow-y: auto; }
    body::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.03) 0%, transparent 50%); animation: pulse 15s ease-in-out infinite; pointer-events: none; }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.1); opacity: 0.8; } }
    .container-main { position: relative; z-index: 1; max-width: 800px; width: 100%; }
    .header { text-align: center; margin-bottom: 3rem; animation: fadeInDown 0.8s ease; }
    @keyframes fadeInDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
    h1 { font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 700; background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 0.75rem; letter-spacing: -0.02em; }
    .subtitle { color: var(--text-secondary); font-size: 1.125rem; font-weight: 400; }
    .search-wrapper { animation: fadeInUp 0.8s ease 0.2s backwards; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    .search-box { display: flex; background: var(--bg-card); border: 2px solid var(--border); border-radius: 16px; overflow: hidden; transition: all 0.3s ease; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(139, 92, 246, 0.1); }
    .search-box:focus-within { border-color: var(--accent); box-shadow: 0 8px 32px rgba(139, 92, 246, 0.2), 0 0 0 3px rgba(139, 92, 246, 0.1); transform: translateY(-2px); }
    .search-box input { flex: 1; background: transparent; border: none; padding: 1.125rem 1.5rem; color: var(--text-primary); font-size: 1.0625rem; outline: none; }
    .search-box input::placeholder { color: var(--text-secondary); }
    .search-box button { background: var(--accent); color: white; border: none; padding: 1.125rem 2rem; font-weight: 600; font-size: 1rem; cursor: pointer; transition: all 0.2s ease; position: relative; overflow: hidden; }
    .search-box button::before { content: ''; position: absolute; top: 50%; left: 50%; width: 0; height: 0; background: rgba(255, 255, 255, 0.2); border-radius: 50%; transform: translate(-50%, -50%); transition: width 0.6s, height 0.6s; }
    .search-box button:hover::before { width: 300px; height: 300px; }
    .search-box button:hover { background: var(--accent-hover); transform: translateX(2px); }
    .search-box button:active { transform: translateX(2px) scale(0.98); }
    .loading-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(10, 10, 15, 0.8); backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: center; }
    .loading-overlay.active { display: flex; }
    .loading-content { text-align: center; }
    .spinner { width: 48px; height: 48px; border: 4px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: var(--text-secondary); font-size: 1rem; }
    @media (max-width: 640px) { body { padding: 1rem; } h1 { font-size: 2rem; } .subtitle { font-size: 1rem; } .search-box input { padding: 1rem 1.25rem; font-size: 1rem; } .search-box button { padding: 1rem 1.5rem; } }
  </style>
</head>
<body>
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-content">
      <div class="spinner"></div>
      <div class="loading-text">Searching...</div>
    </div>
  </div>

  <div class="container-main">
    <div class="header">
      <h1>📚 Flibusta Downloader</h1>
      <p class="subtitle">Find your favorite books and authors instantly</p>
    </div>

    <div class="search-wrapper">
      <form method="POST" class="search-box" id="searchForm">
        <input
          name="query"
          id="searchInput"
          placeholder="Search for authors or book titles..."
          required
          autocomplete="off"
        >
        <button type="submit">Search</button>
      </form>
    </div>

    <!-- Error messages will be displayed here -->
    {% if error %}
    <div class="alert alert-danger mt-4" style="background-color: #381a1a; border-color: #ef4444; color: #f87171;">
        {{ error }}
    </div>
    {% endif %}

  </div>

  <script>
    const searchForm = document.getElementById('searchForm');
    const searchInput = document.getElementById('searchInput');
    const loadingOverlay = document.getElementById('loadingOverlay');

    searchForm.addEventListener('submit', (e) => {
      if (searchInput.value.trim()) {
        loadingOverlay.classList.add('active');
      }
    });

    searchInput.focus();

    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement !== searchInput) {
        e.preventDefault();
        searchInput.focus();
      }
    });
  </script>
</body>
</html>
